<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #6e88d6;
    --texto: #000000;
    --suave: #080808;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--fundo);
    color: var(--texto);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
 
  h1 {
    font-weight: 600;
    font-style: italic;
    font-size: clamp(1.5rem, 4.0vw, 1.8rem);
    color: var(--suave);
    margin-bottom: 2.5rem;
    text-align: center;
  }
 
  /* A largura é fixada pelo JavaScript, para todas as estrofes ficarem alinhadas à esquerda no mesmo sítio */
  #palco {
    min-height: 14rem;
    transition: opacity 1.2s ease;
  }
  #palco.sai { opacity: 0; }
 
  .verso {
    font-size: var(--tam, 1.4rem);  /* ajustado pelo JavaScript */
    line-height: 1.6;
    white-space: nowrap;            /* cada verso fica sempre numa só linha */
    opacity: 0;
    filter: blur(6px);
    transition: opacity 1.4s ease, filter 1.4s ease;
  }
  .verso.visivel { opacity: 1; filter: blur(0); }
 
  button {
    margin-top: 2.5rem;
    font: inherit;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--texto);
    background: none;
    border: 1px solid var(--suave);
    border-radius: 999px;
    padding: 0.5rem 1.6rem;
    cursor: pointer;
  }
  button:hover { background: rgba(143, 179, 173, 0.15); }
  button:focus-visible { outline: 2px solid var(--texto); outline-offset: 3px; }
  button[hidden] { display: none; }
 
  @media (prefers-reduced-motion: reduce) {
    .verso, #palco { transition-duration: 0.01s; filter: none; }
  }
</style>
</head>
<body>
 
<h1 id="titulo"></h1>
<div id="palco" aria-live="polite"></div>
<button id="repetir" hidden>Ler outra vez</button>
 
<!--
  ====== O POEMA FICA AQUI ======
  Apaga tudo o que está entre as duas etiquetas abaixo e cola o teu texto:
  - 1.ª linha: o título
  - uma linha em branco
  - depois as estrofes, com UMA LINHA EM BRANCO entre cada estrofe
-->
<script type="text/plain" id="poema">
Dia de Natal
 
Hoje é dia de ser bom.
É dia de passar a mão pelo rosto das crianças,
de falar e de ouvir com mavioso tom,
de abraçar toda a gente e de oferecer lembranças.
É dia de pensar nos outros – coitadinhos – nos que padecem,
de lhes darmos coragem para poderem continuar a aceitar a sua miséria,
de perdoar aos nossos inimigos, mesmo aos que não merecem,
de meditar sobre a nossa existência, tão efémera e tão séria.

Comove tanta fraternidade universal.
É só abrir o rádio e logo um coro de anjos,
como se de anjos fosse,
numa toada doce,
de violas e banjos,
entoa gravemente um hino ao Criador.
E mal se extinguem os clamores plangentes,
a voz do locutor
anuncia o melhor dos detergentes.

De novo a melopeia inunda a Terra e o Céu
e as vozes crescem num fervor patético.
(Vossa excelência verificou a hora exacta em que o Menino Jesus nasceu?)
Não seja estúpido! Compre imediatamente um relógio de pulso antimagnético.)
Torna-se difícil caminhar nas preciosas ruas.
Toda a gente acotovela, se multiplica em gestos esfuziante,
Todos participam nas alegrias dos outros como se fossem suas
e fazem adeuses enluvados aos bons amigos que passam mais distante.

Nas lojas, na luxúria das montras e dos escaparates,
com subtis requintes de bom gosto e de engenhosa dinâmica,
cintilam, sob o intenso fluxo de milhares de quilovates,
as belas coisas inúteis de plástico, de metal, de vidro e de cerâmica.

Os olhos acorrem, num alvoroço liquefeito,
ao chamamento voluptuoso dos brilhos e das cores.
E como se tudo aquilo nos dissesse directamente respeito,
como se o Céu olhasse para nós e nos cobrisse de bênçãos e favores.

A oratória de Bach embruxa a atmosfera do arruamento.
Adivinha-se uma roupagem diáfana a desembrulhar-se no ar.
E a gente, mesmo sem querer, entra no estabelecimento
e compra – louvado seja o Senhor! – o que nunca tinha pensado comprar.
Mas a maior felicidade é a da gente pequena.
Naquela véspera santa
a sua comoção é tanta, tanta, tanta,
que nem dorme serena.
Cada menino abre um olhinho
na noite incerta
para ver se a aurora já está desperta.
De manhãzinha
salta da cama,
corre à cozinha em pijama.

Ah!!!!!!!

Na branda macieza
da matutina luz
aguarda-o a surpresa
do Menino Jesus.

Jesus,
o doce Jesus,
o mesmo que nasceu na manjedoura,
veio pôr no sapatinho
do Pedrinho
uma metralhadora.

Que alegria
reinou naquela casa em todo o santo dia!
O Pedrinho, estrategicamente escondido atrás das portas,
fuzilava tudo com devastadoras rajadas
e obrigava as criadas
a caírem no chão como se fossem mortas:
tá-tá-tá-tá-tá-tá-tá-tá-tá-tá-tá.
Já está!
E fazia-as erguer para de novo matá-las.
E até mesmo a mamã e o sisudo papá
fingiam
que caíam
crivados de balas.

Dia de Confraternização Universal,
dia de Amor, de Paz, de Felicidade,
de Sonhos e Venturas.
É dia de Natal.
Paz na Terra aos Homens de Boa Vontade.
Glória a Deus nas Alturas.
</script>
 
<script>
  /* ====== VELOCIDADE (em milissegundos) ====== */
  const TEMPO = {
    entreVersos: 1900,   // intervalo entre o aparecimento de cada verso
    fimDaEstrofe: 3500,  // quanto tempo a estrofe completa fica no ecrã
    desvanecer: 1200     // duração do desaparecimento da estrofe
  };
  const TAMANHO_MAX = 22; // tamanho máximo da letra, em pixéis
  /* =========================================== */
 
  // Lê o texto e separa em blocos por linhas em branco
  const blocos = document.getElementById("poema").textContent
    .replace(/\r/g, "")
    .trim()
    .split(/\n\s*\n/)
    .map(b => b.split("\n").map(l => l.trim()).filter(Boolean))
    .filter(b => b.length);
 
  const titulo = blocos.shift().join(" ");
  const estrofes = blocos;
 
  document.title = titulo;
  document.getElementById("titulo").textContent = titulo;
 
  const palco = document.getElementById("palco");
  const botao = document.getElementById("repetir");
  const espera = ms => new Promise(r => setTimeout(r, ms));
 
  // Mede o verso mais largo do poema (em "em", ou seja, relativo ao tamanho da letra)
  let larguraEm = 0;
  function medirVersos() {
    const caixa = document.createElement("div");
    caixa.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font-size:100px";
    document.body.appendChild(caixa);
    for (const estrofe of estrofes) {
      for (const texto of estrofe) {
        const s = document.createElement("span");
        s.textContent = texto;
        caixa.appendChild(s);
        larguraEm = Math.max(larguraEm, s.getBoundingClientRect().width / 100);
      }
    }
    caixa.remove();
    larguraEm *= 1.02; // pequena folga
  }
 
  // Escolhe o maior tamanho de letra em que o verso mais largo cabe no ecrã
  function ajustarTamanho() {
    const disponivel = document.documentElement.clientWidth - 48; // margens laterais
    const tam = Math.min(TAMANHO_MAX, disponivel / larguraEm);
    document.documentElement.style.setProperty("--tam", tam + "px");
    palco.style.width = (larguraEm * tam) + "px";
  }
 
  async function lerPoema() {
    botao.hidden = true;
 
    for (const estrofe of estrofes) {
      palco.classList.remove("sai");
      palco.innerHTML = "";
 
      // Cria todos os versos já (invisíveis) para o layout ficar estável
      const versos = estrofe.map(texto => {
        const p = document.createElement("p");
        p.className = "verso";
        p.textContent = texto;
        palco.appendChild(p);
        return p;
      });
 
      await espera(600);
 
      for (const p of versos) {
        p.classList.add("visivel");
        await espera(TEMPO.entreVersos);
      }
 
      await espera(TEMPO.fimDaEstrofe);
      palco.classList.add("sai");
      await espera(TEMPO.desvanecer);
    }
 
    palco.innerHTML = "";
    botao.hidden = false;
  }
 
  botao.addEventListener("click", lerPoema);
  window.addEventListener("resize", ajustarTamanho);
 
  // Espera pela fonte carregar para medir bem os versos
  document.fonts.load('100px "Cormorant Garamond"').catch(() => {}).then(() => {
    medirVersos();
    ajustarTamanho();
    lerPoema();
  });
</script>
</body>
</html>
